<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>我的第一个动画</title>
  <!-- 这一行是引入 p5.js 魔法库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    /* 这一块是 CSS，用来去掉页面默认的白边 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* 隐藏滚动条 */
      background-color: #1a1a1a; /* 深色背景更酷 */
    }
  </style>
</head>
<body>
  <script>
    // 下面这段是 JavaScript 代码
    function setup() {
      // 创建一个跟浏览器窗口一样大的画布
      createCanvas(windowWidth, windowHeight);
    }

    function draw() {
  // 背景照旧
  background(26, 26, 26, 30); 
  
  fill(0, 255, 255); // 固定青色
  noStroke(); 
  
  // 这是一个循环：让 i 从 0 变到 800，每次增加 50
  for (let i = 0; i < 800; i = i + 50) {
    // 在横坐标 i，纵坐标 200 的位置画一个半径为 20 的圆
    ellipse(i, 200, 40);
  }
}function draw() {
  // 背景照旧
  background(26, 26, 26, 30); 
  
  fill(0, 255, 255); // 固定青色
  noStroke(); 
  
  // 这是一个循环：让 i 从 0 变到 800，每次增加 50
  for (let i = 0; i < 800; i = i + 50) {
    // 在横坐标 i，纵坐标 200 的位置画一个半径为 20 的圆
    ellipse(i, 200, 40);
  }
}

    // 让画布随窗口大小改变而自适应
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
